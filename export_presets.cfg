; SAKIKO export packaging. Keep readable legal sidecars in release archives too.
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.txt,*.json,LICENSE.txt,THIRD_PARTY_NOTICES.md,ASSET_SOURCES.md"
exclude_filter="tests/*,tools/*,builds/*,docs/*,assets/audio/production/*.wav,assets/audio/teacher_lesson.wav,assets/audio/festival_recording.wav,assets/audio/festival_date_recording.wav,assets/audio/festival_custodian.wav,assets/audio/festival_students.wav"
export_path="builds/windows/SAKIKO.exe"
script_export_mode=2

[preset.0.options]

custom_template/release=".asset-cache/export-templates/windows_release_x86_64.exe"
custom_template/debug=".asset-cache/export-templates/windows_debug_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
application/modify_resources=true
application/company_name="medissl"
application/product_name="SAKIKO"
application/file_description="SAKIKO proprietary game by medissl"
application/copyright="Copyright © 2026 medissl. All rights reserved."
