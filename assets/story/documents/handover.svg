<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b"/><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80"/><path d="M340 18L337 939" stroke="#a69c87" opacity=".20"/><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12"/><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">Office handover note</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">Night duty handover</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">The small service key for the staff-room key</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a">cabinet is in the shallow office drawer below</text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">this notice. Return it after use.</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">One entrance-lock key is kept on the cabinet</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a">hook for the caretaker.</text></svg>