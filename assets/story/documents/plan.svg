<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b"/><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80"/><path d="M340 18L337 939" stroke="#a69c87" opacity=".20"/><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12"/><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">Maintenance plan</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">OLD SCENERY STORE</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a">Behind the archive shelving, south end of the</text><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">old wing.</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">Lift the floor brake, then slide the shelf</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a">toward the rear wall. The rails keep the doorway</text><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">clear.</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="340" font-family="Georgia,serif" font-size="21" fill="#34302a">Yui returned the fourth entrance-lock key in the</text><text x="44" y="368" font-family="Georgia,serif" font-size="21" fill="#34302a">old student bag while clearing the attraction.</text><text x="44" y="396" font-family="Georgia,serif" font-size="21" fill="#34302a">The bag was left in the store with the portrait</text><text x="44" y="424" font-family="Georgia,serif" font-size="21" fill="#34302a">and personal papers.</text></svg>