<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b"/><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80"/><path d="M340 18L337 939" stroke="#a69c87" opacity=".20"/><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12"/><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">AV equipment loan slip</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">Mika Endo / festival equipment</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">Equipment case B2 belongs to class 3.</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a">Combination convention: class number, shelf</text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">number, number of knocks in the attraction cue.</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">The tape preserves the knock cue. A transcript</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a">is kept with it.</text><text x="44" y="340" font-family="Georgia,serif" font-size="21" fill="#34302a">The third entrance-lock key is stored in the</text><text x="44" y="368" font-family="Georgia,serif" font-size="21" fill="#34302a">case so the AV monitor can secure the entrance</text><text x="44" y="396" font-family="Georgia,serif" font-size="21" fill="#34302a">after equipment collection.</text></svg>