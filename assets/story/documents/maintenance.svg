<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b" /><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80" /><path d="M340 18L337 939" stroke="#a69c87" opacity=".20" /><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12" /><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">Caretaker’s maintenance sheet</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a" /><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">16 October 1999</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a" /><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">08:40  Scenery storeroom opened.</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a">Student found shortly afterward. Police</text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">notified.</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a" /><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">18:10  Returned to secure storeroom.</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a">Knocking heard inside.</text><text x="44" y="340" font-family="Georgia,serif" font-size="21" fill="#34302a" /><text x="44" y="396" font-family="Georgia,serif" font-size="21" fill="#34302a">handwritten original.</text></svg>