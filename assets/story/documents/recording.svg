<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b"/><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80"/><path d="M340 18L337 939" stroke="#a69c87" opacity=".20"/><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12"/><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">Festival recording / captions</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">[Student chatter]</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a">&quot;Does it hang straight?&quot;</text><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">&quot;Put the spare equipment case on shelf B two.&quot;</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a">[Laughter]</text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">[Three quiet knocks]</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a">&quot;Is that part of the attraction?&quot;</text><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">&quot;Leave it. We still have cleanup.&quot;</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="340" font-family="Georgia,serif" font-size="21" fill="#34302a">AV case B2: class 3, shelf 2, three knocks. The</text><text x="44" y="368" font-family="Georgia,serif" font-size="21" fill="#34302a">combination convention is written on the loan</text><text x="44" y="396" font-family="Georgia,serif" font-size="21" fill="#34302a">slip.</text></svg>