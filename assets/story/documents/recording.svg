<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450"><rect width="640" height="450" fill="#c4b99b"/><path d="M18 12H620V430H12Z" fill="#d1c8af" stroke="#a59b80"/><circle cx="574" cy="390" r="39" fill="#8e7d5d" opacity=".13"/><text x="30" y="44" font-family="Georgia,serif" font-size="23" fill="#573b36">Festival recording / captions</text><text x="30" y="85" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">[Student chatter]</text><text x="30" y="112" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">“Does it hang straight?”</text><text x="30" y="139" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">“Put the spare equipment case on shelf B two.”</text><text x="30" y="166" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">[Laughter]</text><text x="30" y="193" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">[Three quiet knocks]</text><text x="30" y="220" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">“Is that part of the attraction?”</text><text x="30" y="247" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a">“Leave it. We still have cleanup.”</text><text x="30" y="274" font-family="Segoe Print,Georgia,serif" font-size="18" fill="#34302a"></text></svg>