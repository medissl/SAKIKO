<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960"><rect width="680" height="960" fill="#c4b99b"/><path d="M12 15L666 11L670 942L10 948Z" fill="#d1c8af" stroke="#a59b80"/><path d="M340 18L337 939" stroke="#a69c87" opacity=".20"/><circle cx="590" cy="870" r="44" fill="#8e7d5d" opacity=".12"/><text x="44" y="60" font-family="Georgia,serif" font-size="21" fill="#34302a">School notice</text><text x="44" y="88" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="116" font-family="Georgia,serif" font-size="21" fill="#34302a">18 October 1999</text><text x="44" y="144" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="172" font-family="Georgia,serif" font-size="21" fill="#34302a">We regret to inform families of the death of</text><text x="44" y="200" font-family="Georgia,serif" font-size="21" fill="#34302a">student Sakiko following an accident in a</text><text x="44" y="228" font-family="Georgia,serif" font-size="21" fill="#34302a">restricted scenery storage room.</text><text x="44" y="256" font-family="Georgia,serif" font-size="21" fill="#34302a"></text><text x="44" y="284" font-family="Georgia,serif" font-size="21" fill="#34302a">Festival activities are suspended. Please direct</text><text x="44" y="312" font-family="Georgia,serif" font-size="21" fill="#34302a">inquiries to the school office.</text></svg>